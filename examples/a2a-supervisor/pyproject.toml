[project]
name = "a2a-supervisor-example"
version = "0.1.0"
description = "A Deep Agents supervisor for remote A2A agents"
requires-python = ">=3.11,<3.15"
dependencies = [
    "a2a-sdk>=1.1.2,<2.0.0",
    "deepagents>=0.7.11,<0.8.0",
    "httpx>=0.28.1,<1.0.0",
]

[tool.uv.sources]
deepagents = { path = "../../libs/deepagents", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.0,<10.0.0",
    "pytest-asyncio>=0.26.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
    "ty>=0.0.1a16,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
