# Check that all uv.lock files are up-to-date
#
# Prevents PRs from being merged when lockfiles are out of sync with pyproject.toml

name: "🔒 Check Lockfiles"

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-lockfiles:
    name: "Verify uv.lock files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "🐍 Set up Python and uv"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.14"
          # This job only runs `uv lock --check`, never `uv sync`, so the uv
          # cache dir stays absent — and setup-uv's post-job save *throws* on a
          # missing cache path rather than warning, failing the job. Surfaced
          # alongside the setup-uv v9.0.0 bump, though v7.6.0 has the same throw
          # — so treat v9 as when this was noticed, not as what introduced it.
          #
          # setup-uv's `ignore-nothing-to-cache: true` would fix the whole class
          # of this in one place, but `uv_setup` does not forward that input.
          # Disabling the cache is equivalent here: there is nothing to cache.
          enable-cache: "false"

      - name: "🔍 Check changed lockfiles"
        run: |
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          python3 .github/scripts/checks/check_lockfiles_pre_commit.py "${changed[@]}"
