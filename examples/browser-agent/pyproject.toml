[project]
name = "langchain-browser-agent-example"
version = "0.1.0"
description = "A Playwright browser agent built with LangChain create_agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.1,<2.0.0",
    "langchain-openai>=1.6.2,<2.0.0",
    "playwright>=1.58.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.15.0,<1.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
