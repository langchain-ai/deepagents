# Main CI workflow for Deep Agents monorepo
#
# Runs on every pull request:
# - Linting for changed packages
# - Unit Tests for changed packages
#
# PR feedback selects changed packages; SDK changes also trigger CLI and ACP tests.
# Merge-queue runs, pushes to main, and workflow changes run full CI.

name: "🔧 CI"

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Cancel redundant workflow runs, except trusted release-bot PR updates whose
# new head may need to inspect the prior run before it finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'pull_request' ||
      github.actor != vars.RELEASE_BOT_LOGIN ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'release-please--branches--main--components--')
    }}

# `pull-requests: read` lets the called `_test.yml` reusable workflow read live
# PR labels (re-runs replay the original event payload, so the API is the only
# fresh source). A called workflow's token can only narrow the caller's grants.
# The issues labels endpoint it uses accepts either `issues: read` or
# `pull-requests: read`, so no `issues` grant is needed here.
permissions:
  checks: read
  contents: read
  pull-requests: read

env:
  UV_NO_SYNC: "true"

jobs:
  check-lockfiles:
    name: "🔒 Check Lockfiles"
    uses: ./.github/workflows/check_lockfiles.yml

  # Its own job (not a step of another) so a failure is named for what failed.
  # The hook list lives in libs/Makefile so `make -C libs hygiene` runs the
  # same check locally.
  text-hygiene:
    name: "📝 Text Hygiene"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🐍 Set up uv"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.14"
          # Nothing runs `uv sync`, so there is no cache dir for setup-uv's
          # post-job save, which would otherwise fail the job.
          enable-cache: "false"

      - name: "📝 Run hygiene hooks on changed files"
        env:
          HYGIENE_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HYGIENE_TO: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PRE_COMMIT_COLOR: always
        run: |
          if make -C libs hygiene; then exit 0; fi
          # The fixing hooks leave their edits in the worktree; annotate each
          # changed hunk so the failure shows on the PR's diff and checks page
          # instead of only in this log.
          git diff -U0 --no-color | awk '
            /^\+\+\+ b\// { file = substr($0, 7) }
            /^@@/ {
              split($3, hunk, ",")
              line = substr(hunk[1], 2)
              printf "::error file=%s,line=%s,title=Text hygiene::Smart quotes, irregular spaces, trailing whitespace or a missing final newline. Run `make -C libs hygiene` and commit the fixes.\n", file, line
            }'
          echo "::error::Changed files fail text hygiene hooks. Run \`make -C libs hygiene\` locally and commit the fixes."
          exit 1

  # Detect which packages have changes
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      deepagents: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.deepagents == 'true' }}
      code: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.code == 'true' }}
      talon: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.talon == 'true' }}
      evals: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.evals == 'true' }}
      acp: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.acp == 'true' }}
      daytona: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.daytona == 'true' }}
      modal: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.modal == 'true' }}
      runloop: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.runloop == 'true' }}
      vercel: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.vercel == 'true' }}
      quickjs: ${{ steps.curated-apply.outputs.only != 'true' && steps.filter.outputs.quickjs == 'true' }}
      curated-apply-only: ${{ steps.curated-apply.outputs.only || 'false' }}
      curated-apply-parent-conclusion: ${{ steps.curated-apply.outputs.prior-conclusion }}
      curated-apply-parent-sha: ${{ steps.curated-apply.outputs.parent-sha }}
      curated-apply-parent-check: ${{ steps.curated-apply.outputs.parent-check }}
    steps:
      # On ordinary PRs paths-filter lists changed files through the API, so
      # a shallow clone skips downloading full history (~370 MB of packs).
      # Push and merge_group diff against git history, and release-please
      # branches need the head's parent for the curated-apply check.
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) && 1 || 0 }}

      - name: "📋 Checkout detector from trusted base ref"
        if: >-
          github.event_name == 'pull_request' &&
          github.actor == vars.RELEASE_BOT_LOGIN &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'release-please--branches--main--components--')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: .curated-apply-base
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/checks/curated_apply_only.py
            release-please-config.json

      - name: "📝 Detect a changelog-only curated-notes apply"
        id: curated-apply
        if: >-
          github.event_name == 'pull_request' &&
          github.actor == vars.RELEASE_BOT_LOGIN &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'release-please--branches--main--components--')
        env:
          BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN }}
          BOT_ID: ${{ vars.RELEASE_BOT_ID }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          only="$(python3 .curated-apply-base/.github/scripts/checks/curated_apply_only.py \
            --repo "$GITHUB_WORKSPACE" \
            --config .curated-apply-base/release-please-config.json \
            --head "$HEAD_SHA" \
            --branch "$HEAD_REF" \
            --bot-login "$BOT_LOGIN" \
            --bot-id "$BOT_ID")"
          if [ "$only" = true ]; then
            parent="$(git rev-parse "$HEAD_SHA^")"
            parent_check="$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/commits/$parent/check-runs?check_name=%E2%9C%85%20CI%20Success&filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.name == "✅ CI Success")] | if length == 1 then .[0] | {id, conclusion, details_url, check_suite: {id: .check_suite.id}} else {} end' \
              2>/dev/null || true)"
            if ! parent_check="$(printf '%s' "$parent_check" | jq -cs 'if length == 1 and (.[0] | type) == "object" then .[0] else {} end' 2>/dev/null)"; then
              parent_check='{}'
            fi
            conclusion="$(printf '%s' "$parent_check" | jq -r '.conclusion // ""')"
            case "$conclusion" in
              success|failure) ;;
              *)
                only=false
                conclusion=''
                echo "Prior CI is not conclusive; running the normal package jobs."
                ;;
            esac
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "prior-conclusion=${conclusion:-}" >> "$GITHUB_OUTPUT"
          echo "parent-sha=${parent:-}" >> "$GITHUB_OUTPUT"
          echo "parent-check=${parent_check:-}" >> "$GITHUB_OUTPUT"

      - name: "🔍 Check for changes"
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Each package filter includes workflow/action paths so that CI
          # infrastructure changes are validated against all packages.
          #
          # NOTE: Do NOT add negation patterns (e.g. '!libs/foo/**/*.md')
          # here. dorny/paths-filter evaluates patterns with OR logic, so a
          # negation like '!libs/deepagents/**/*.md' becomes "match anything
          # NOT in that glob" — causing unrelated files (e.g. .github/
          # templates) to match every filter and trigger full CI.
          # See: https://github.com/dorny/paths-filter/issues/97
          # Packages that editable-install the SDK (`deepagents = { path = ... }`)
          # must include 'libs/deepagents/**' so an SDK change runs their tests
          # too — otherwise a breaking SDK change merges green and only fails
          # on main, where every job runs unconditionally.
          filters: |
            deepagents:
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            code:
              - 'libs/code/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            talon:
              - 'libs/talon/**'
              - 'libs/deepagents/**'
              - 'libs/code/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            evals:
              - 'libs/evals/**'
              - 'libs/deepagents/**'
              # The evals test suite asserts on its own workflow files (e.g.
              # test_harbor_langsmith_integration.py reads harbor.yml and
              # _eval.yml), so editing any eval workflow must run the evals
              # tests that validate it — otherwise the change skips its guard.
              - '.github/workflows/evals.yml'
              - '.github/workflows/harbor.yml'
              - '.github/workflows/_harbor_run.yml'
              - '.github/workflows/unified_evals.yml'
              - '.github/workflows/clbench.yml'
              - '.github/workflows/evals_trials.yml'
              - '.github/workflows/_eval.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            acp:
              - 'libs/acp/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            daytona:
              - 'libs/partners/daytona/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            modal:
              - 'libs/partners/modal/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            runloop:
              - 'libs/partners/runloop/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            vercel:
              - 'libs/partners/vercel/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            quickjs:
              - 'libs/partners/quickjs/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
  # Run linting on changed packages
  lint-deepagents:
    name: "🧹 Lint deepagents"
    needs: changes
    if: needs.changes.outputs.deepagents == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/deepagents"
      python-version: "3.11"

  lint-code:
    name: "🧹 Lint code"
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/code"
      python-version: "3.14"

  lint-talon:
    name: "🧹 Lint talon"
    needs: changes
    if: needs.changes.outputs.talon == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/talon"
      python-version: "3.14"

  lint-evals:
    name: "🧹 Lint evals"
    needs: changes
    if: needs.changes.outputs.evals == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/evals"
      python-version: "3.14"

  lint-acp:
    name: "🧹 Lint acp"
    needs: changes
    if: needs.changes.outputs.acp == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/acp"
      python-version: "3.11"

  lint-daytona:
    name: "🧹 Lint daytona"
    needs: changes
    if: needs.changes.outputs.daytona == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/daytona"
      python-version: "3.11"

  lint-modal:
    name: "🧹 Lint modal"
    needs: changes
    if: needs.changes.outputs.modal == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/modal"
      python-version: "3.11"

  lint-runloop:
    name: "🧹 Lint runloop"
    needs: changes
    if: needs.changes.outputs.runloop == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/runloop"
      python-version: "3.11"

  lint-vercel:
    name: "🧹 Lint vercel"
    needs: changes
    if: needs.changes.outputs.vercel == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/vercel"
      python-version: "3.11"

  lint-quickjs:
    name: "🧹 Lint quickjs"
    needs: changes
    if: needs.changes.outputs.quickjs == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/quickjs"
      python-version: "3.11"

  # Run unit tests on changed packages
  test-deepagents:
    name: "🧪 Test deepagents"
    needs: changes
    if: needs.changes.outputs.deepagents == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/deepagents"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      extra-configurations: '[{"python-version": "3.13", "os": "windows-latest"}]'

  test-code:
    name: "🧪 Test deepagents-code"
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/code"
      python-versions: '["3.14"]'
      # The longest job on the critical path; `tests/unit_tests/conftest.py`
      # reads `PYTEST_SHARD` and keeps a stable third of the tests per leg.
      shards: '["1/3", "2/3", "3/3"]'

  test-talon:
    name: "🧪 Test deepagents-talon"
    needs: changes
    if: needs.changes.outputs.talon == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/talon"
      python-versions: '["3.14"]'

  test-evals:
    name: "🧪 Test evals"
    needs: changes
    if: needs.changes.outputs.evals == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/evals"
      python-versions: '["3.14"]'

  test-acp:
    name: "🧪 Test acp"
    needs: changes
    if: needs.changes.outputs.acp == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/acp"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  test-daytona:
    name: "🧪 Test daytona"
    needs: changes
    if: needs.changes.outputs.daytona == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/daytona"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  test-modal:
    name: "🧪 Test modal"
    needs: changes
    if: needs.changes.outputs.modal == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/modal"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  test-runloop:
    name: "🧪 Test runloop"
    needs: changes
    if: needs.changes.outputs.runloop == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/runloop"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  test-vercel:
    name: "🧪 Test vercel"
    needs: changes
    if: needs.changes.outputs.vercel == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/vercel"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  test-quickjs:
    name: "🧪 Test quickjs"
    needs: changes
    if: needs.changes.outputs.quickjs == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/quickjs"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  # Catch SDK -> quickjs prompt-snapshot drift: when the deepagents SDK
  # changes but the quickjs partner is untouched, the full test-quickjs suite
  # does NOT run (it gates on the quickjs filter), so nothing would validate
  # quickjs's vendored system-prompt snapshots against the new SDK. This job
  # fills that gap by re-running just the prompt smoke tests against the
  # editable local SDK (resolved via [tool.uv.sources] in quickjs).
  #
  # Skipped when:
  #   - deepagents != 'true': the SDK is unchanged, so there is no new prompt
  #     wording for the snapshots to drift against.
  #   - quickjs == 'true': the full test-quickjs suite already runs these
  #     snapshots via `make test`, so this would be redundant.
  #   - push: test-quickjs runs on every push regardless of the filter, so
  #     the full suite covers the snapshots there too.
  test-quickjs-sdk-smoke:
    name: "🧪 Test quickjs SDK smoke"
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.deepagents == 'true' &&
      needs.changes.outputs.quickjs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Match the canonical test path (_test.yml) and the quickjs Makefile:
    # freeze against uv.lock so `uv sync` cannot rewrite the lockfile (which
    # would dirty the tree and trip the clean-working-directory check below).
    # The editable SDK path dep still reflects the checkout regardless.
    env:
      UV_FROZEN: "true"
    defaults:
      run:
        working-directory: "libs/partners/quickjs"
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🐍 Set up Python 3.11 + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          cache-suffix: test-quickjs-sdk-smoke
          working-directory: "libs/partners/quickjs"

      - name: "📦 Install Test Dependencies"
        shell: bash
        run: uv sync --group test

      # Fail loudly if the smoke test file is moved or renamed. Because any
      # change under libs/partners/quickjs/** flips the quickjs filter to
      # 'true' (skipping this job), such a rename lands on a PR that never
      # runs this job — so without this guard a stale path would silently
      # collect zero tests on some later SDK-only PR instead of failing here.
      - name: "🔍 Verify Smoke Test Path"
        shell: bash
        run: |
          set -eu
          test -f tests/unit_tests/smoke_tests/test_system_prompt.py || {
            echo "::error::quickjs smoke test file moved or renamed; update its path in ci.yml"
            exit 1
          }

      - name: "🧪 Run quickjs prompt smoke tests"
        shell: bash
        run: >-
          uv run --group test pytest
          --disable-socket
          --allow-unix-socket
          tests/unit_tests/smoke_tests/test_system_prompt.py

      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu
          STATUS="$(git status)"
          echo "$STATUS"
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  drbench-dataset:
    name: "🗂️ Build DRBench dataset"
    needs: changes
    if: needs.changes.outputs.evals == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # `datasets/drbench-evals` commits no task directories: all 100 are generated from
    # upstream's configs at the pinned commit. Since the generated tree is no longer in
    # the PR diff, this job is what proves generation still works and is reproducible.
    # `make dataset-check` builds the dataset twice and diffs -- catching a
    # nondeterministic generator, which would otherwise silently give this runner and a
    # developer's laptop different datasets and make their scores incomparable.
    env:
      UV_FROZEN: "true"
    defaults:
      run:
        working-directory: "libs/evals"
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🐍 Set up Python 3.14 + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.14"
          cache-suffix: drbench-dataset
          working-directory: "libs/evals"

      - name: "📦 Install Dependencies"
        shell: bash
        run: uv sync

      - name: "🔁 Verify generation is deterministic"
        shell: bash
        run: make dataset-check

      - name: "🗂️ Build the dataset in place"
        shell: bash
        run: make dataset

      # The generated task directories are git-ignored, so building them must leave the
      # tree clean. A failure here means a generated path escaped .gitignore.
      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu
          STATUS="$(git status)"
          echo "$STATUS"
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  # Validates every helper script under .github/scripts/tests/. Job id/name
  # are kept for branch-protection compatibility; rename only with a coordinated PR.
  check-release-options:
    name: "Validate Release Options"
    needs: changes
    if: needs.changes.outputs.curated-apply-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🐍 Setup Python 3.14"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # test_release_notes.py shells out to `node --test`; pin Node so the
      # helper-script tests don't rely on whatever the runner image preinstalls.
      - name: "🟢 Setup Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: "📦 Install Dependencies"
        run: python -m pip install packaging pyyaml pytest
      - name: "🔍 Check workflow helper scripts"
        run: python -m pytest .github/scripts/tests -v

  # Final status check - ensures all jobs passed
  ci_success:
    name: "✅ CI Success"
    needs:
      - changes
      - check-lockfiles
      - text-hygiene
      - lint-deepagents
      - lint-code
      - lint-talon
      - lint-evals
      - lint-acp
      - lint-daytona
      - lint-modal
      - lint-runloop
      - lint-vercel
      - lint-quickjs
      - test-deepagents
      - test-code
      - test-talon
      - test-evals
      - test-acp
      - test-daytona
      - test-modal
      - test-runloop
      - test-vercel
      - test-quickjs
      - test-quickjs-sdk-smoke
      - drbench-dataset
      - check-release-options
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report inherited CI failure
        if: >-
          needs.changes.outputs.curated-apply-only == 'true' &&
          needs.changes.outputs.curated-apply-parent-conclusion == 'failure'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PARENT_SHA: ${{ needs.changes.outputs.curated-apply-parent-sha }}
          PARENT_CHECK: ${{ needs.changes.outputs.curated-apply-parent-check }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}`;
            const parentUrl = `${repoUrl}/commit/${process.env.PARENT_SHA}`;
            const message = 'This curated-notes-only commit inherits failed parent CI. Package jobs were skipped, not passed; the CI Success gate remains failed.';
            core.error(`${message} Parent commit: ${parentUrl}`);
            const currentRunUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const lines = [message, '', `Parent commit: ${parentUrl}`];
            let parentRunId;
            const jobUrl = value => {
              const prefix = `${repoUrl}/actions/runs/`;
              return typeof value === 'string' && value.startsWith(prefix) &&
                /^\d+\/job\/\d+$/.test(value.slice(prefix.length)) ? value : '';
            };
            const escape = value => String(value).replace(/[&<>"']/g, char => ({
              '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            })[char]);
            try {
              const check = JSON.parse(process.env.PARENT_CHECK);
              const url = jobUrl(check.details_url);
              if (url) {
                parentRunId = url.split('/job/')[0].split('/').pop();
                lines.push(`Parent CI run: ${url.split('/job/')[0]}`, `Parent CI Success check: ${url}`);
                core.info(lines.slice(-2).join('\n'));
              }
              const checks = await github.paginate(github.rest.checks.listForSuite, {
                owner, repo, check_suite_id: check.check_suite.id,
                filter: 'latest', per_page: 100,
              });
              const failed = checks.filter(candidate => candidate.id !== check.id &&
                ['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale'].includes(candidate.conclusion));
              lines.push('', 'Unsuccessful checks currently reported by the parent CI suite (may change after reruns):');
              for (const candidate of failed) {
                const link = jobUrl(candidate.details_url);
                core.error(`Parent job ${JSON.stringify(candidate.name)} concluded ${candidate.conclusion}. Inspect ${link || parentUrl}`, {
                  title: 'Inherited parent CI failure',
                });
                lines.push(`- <code>${escape(candidate.name)}</code>: ${candidate.conclusion}${link ? ` — ${link}` : ''}`);
              }
              if (!failed.length) {
                const fallback = 'No unsuccessful sibling checks are currently available; inspect the linked parent CI check/run. The captured inherited failure is unchanged.';
                core.info(fallback);
                lines.push(fallback);
              }
            } catch {
              const fallback = 'Parent check details could not be retrieved; inspect the parent commit checks. The inherited failure is unchanged.';
              core.warning(fallback);
              lines.push('', fallback);
            }
            lines.push('', '### Troubleshoot and retry',
              '1. Open the unsuccessful parent job above and inspect its failing step. Fix a real failure through the normal PR/release refresh flow; retry only if the failure is transient.',
              `2. For a transient failure, open the parent CI run and choose **Re-run failed jobs**${parentRunId ? ` (\`gh run rerun ${parentRunId} --failed --repo ${owner}/${repo}\`)` : ''}. Wait for its **CI Success** check to pass.`,
              `3. Open [this head workflow run](${currentRunUrl}) and choose **Re-run all jobs** (\`gh run rerun ${context.runId} --repo ${owner}/${repo}\`) to re-read the parent result. **Re-run failed jobs** alone reuses the old detection output and will still inherit the failure.`,
              '', 'Skipped package jobs are not passing tests. This head is only green after its own CI Success check passes.');
            await core.summary.addHeading('Inherited parent CI failure').addRaw(lines.join('\n')).write();

      - name: "🎉 All Checks Passed"
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LOCKFILES_RESULT: ${{ needs.check-lockfiles.result }}
          HYGIENE_RESULT: ${{ needs.text-hygiene.result }}
          CURATED_APPLY_ONLY: ${{ needs.changes.outputs.curated-apply-only }}
          CURATED_APPLY_PARENT_CONCLUSION: ${{ needs.changes.outputs.curated-apply-parent-conclusion }}
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ toJSON(needs.changes.outputs) }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ]; then
            echo "Change detection did not pass: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$LOCKFILES_RESULT" != success ]; then
            echo "Lockfile validation did not pass: $LOCKFILES_RESULT"
            exit 1
          fi
          # Text hygiene only runs on pull_request and merge_group.
          if [ "$HYGIENE_RESULT" != success ] && ! { [ "$EVENT_NAME" = push ] && [ "$HYGIENE_RESULT" = skipped ]; }; then
            echo "Text hygiene validation did not pass: $HYGIENE_RESULT"
            exit 1
          fi
          if [ "$CURATED_APPLY_ONLY" = true ] && [ "$EVENT_NAME" = pull_request ]; then
            if [ "$CURATED_APPLY_PARENT_CONCLUSION" != success ]; then
              echo "Prior-head CI failed; refusing to pass the changelog-only apply commit."
              exit 1
            fi
            echo "The release-bot changelog-only commit inherits successful prior-head CI."
          fi
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          event = os.environ["EVENT_NAME"]
          selection = json.loads(os.environ["SELECTION"])
          packages = "deepagents code talon evals acp daytona modal runloop vercel quickjs".split()
          expected = {"changes", "check-lockfiles", "check-release-options"}
          inherited = event == "pull_request" and os.environ["CURATED_APPLY_ONLY"] == "true"
          allowed_skips = set()
          if inherited:
              allowed_skips.add("check-release-options")
          for package in packages:
              selected = selection.get(package)
              if selected not in {"true", "false"}:
                  sys.exit(f"Invalid selection: {package}={selected!r}")
              jobs = {f"lint-{package}", f"test-{package}"}
              expected.update(jobs)
              if event == "pull_request" and selected == "false":
                  allowed_skips.update(jobs)
          expected.update({"text-hygiene", "drbench-dataset", "test-quickjs-sdk-smoke"})
          if event == "pull_request" and selection["evals"] == "false":
              allowed_skips.add("drbench-dataset")
          if event == "push":
              allowed_skips.add("text-hygiene")
          if event != "pull_request" or selection["deepagents"] != "true" or selection["quickjs"] == "true":
              allowed_skips.add("test-quickjs-sdk-smoke")
          missing = expected - needs.keys()
          if missing:
              sys.exit(f"Missing job results: {sorted(missing)}")
          for job, entry in needs.items():
              result = entry["result"]
              if result not in {"success", "failure", "cancelled", "skipped"}:
                  sys.exit(f"Unknown job result: {job}={result!r}")
              if result == "skipped" and job not in allowed_skips:
                  sys.exit(f"Required job did not run: {job}")
              if result not in {"success", "skipped"}:
                  sys.exit(f"Job did not pass: {job}={result}")
          print("All required checks passed; only explicitly unselected checks may be skipped.")
          PYTHON
