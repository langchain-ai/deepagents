name: Sync topic label manifest

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-topic-label-manifest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ORG_MEMBERSHIP_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_MEMBERSHIP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Refresh topic label manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const { syncTopicLabels } = require('./.github/scripts/labeling/sync-topic-labels.js');
            await syncTopicLabels(
              github, owner, repo, path.resolve('.github/topic-labels.json'),
            );

      - name: Open or refresh manifest pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: automation/sync-topic-labels
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- .github/topic-labels.json
          if git diff --cached --quiet; then
            existing_prs=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number')
            for pr in $existing_prs; do
              gh pr close "$pr" --delete-branch
            done
            echo "Topic label manifest is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(infra): sync topic label manifest"
          git branch -f "$BRANCH"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "chore(infra): sync topic label manifest" \
              --body "Updates the cached topic-label choices used by issue classification."
          fi
