# Remove the "pending-deletion" label as soon as a PR gains "do-not-close",
# and minimize the stale auto-close warning comment that was posted with it.
#
# .github/scripts/labeling/close-old-prs.js already strips the label when it
# notices a bypassed PR, but that script runs on a daily schedule; this
# workflow clears the stale state immediately instead of leaving a "pending
# deletion" warning on a PR a maintainer has just marked exempt.
#
# pull_request_target is required here: for PRs opened from forks, a plain
# pull_request workflow receives a read-only GITHUB_TOKEN regardless of who
# applied the label, so issues.removeLabel would 403 and pending-deletion
# would linger on exactly the external PRs this automation targets. (That
# downgrade is the default behavior; it does not apply when "Send write tokens
# to workflows from pull requests" is enabled for the org.)
#
# No app token is passed to the github-script step below, so it runs with the
# default GITHUB_TOKEN and the resulting `unlabeled` event does NOT re-trigger
# other workflows: GitHub does not trigger new workflow runs from actions
# performed by the default GITHUB_TOKEN (with narrow exceptions like
# workflow_dispatch). That suppression is load-bearing here, not incidental —
# block_fork_main_prs.yml, require_issue_link.yml, and
# release_fanout_bypass_warn.yml all listen for `unlabeled` on PRs.

name: Clear pending-deletion on do-not-close

on:
  # pull_request_target is safe here: we never check out or execute the PR's
  # code — only read the event payload and manage labels and comments.
  # NEVER CHECK OUT UNTRUSTED CODE FROM A PR's HEAD IN A pull_request_target JOB.
  # Doing so would allow attackers to execute arbitrary code in the context of your repository.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  remove-pending-deletion:
    if: >-
      github.event.label.name == 'do-not-close' &&
      contains(github.event.pull_request.labels.*.name, 'pending-deletion')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Remove pending-deletion label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # `labeled` fires exactly once per label application, so unlike the
          # daily sweep in close-old-prs.js there is no next run to pick up a
          # transient failure. Retry 429/5xx; the action's default
          # retry-exempt-status-codes still leaves 403/404 alone.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            console.log(
              `PR #${issue_number} gained do-not-close — removing pending-deletion`,
            );

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: 'pending-deletion',
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              // The job's `if:` already saw pending-deletion in the event
              // payload, so a 404 normally means a genuine race (the daily
              // close_old_prs sweep, or a maintainer, got there first). But a
              // 404 looks identical if the label name above ever drifts from
              // close-old-prs.js, which would silently turn this workflow into
              // a permanent no-op — so warn rather than logging it as routine.
              core.warning(
                `removeLabel returned 404 for 'pending-deletion' on PR ` +
                `#${issue_number}; the label was present in the event payload, ` +
                `so this is either a race or a stale label name: ${e.message}`,
              );
            }

            // The label is only half of what a maintainer sees: close-old-prs.js
            // posts a warning comment alongside it that claims the PR will be
            // auto-closed. Minimize it so the PR does not keep advertising a
            // fate that no longer applies. Best-effort — the label removal
            // above is the load-bearing part.
            // (marker synced w/ COMMENT_MARKER in close-old-prs.js)
            try {
              const marker = '<!-- old-pr-auto-close -->';
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              );
              const stale = comments.find(c => c.body && c.body.includes(marker));
              if (stale) {
                await github.graphql(`
                  mutation($id: ID!) {
                    minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                      minimizedComment { isMinimized }
                    }
                  }
                `, { id: stale.node_id });
                console.log(`Minimized stale auto-close warning ${stale.id} as outdated`);
              }
            } catch (e) {
              core.warning(
                `Could not minimize stale auto-close warning on PR #${issue_number}: ${e.message}`,
              );
            }
