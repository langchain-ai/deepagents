[project]
name = "out-of-process-quickjs"
version = "0.1.0"
description = "Run model-written JavaScript in a credential-less QuickJS worker process"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain-core>=1.3.0,<2.0.0",
    "quickjs-rs>=0.3.0,<0.4.0",
    "pyseccomp>=0.1.2; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/langchain-ai/deepagents/tree/main/examples/out-of-process-quickjs"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qjs_worker"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
