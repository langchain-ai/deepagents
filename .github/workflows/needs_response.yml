# Close issues and PRs that maintainers labeled `needs-response` once the
# original author has gone quiet, and clear the label as soon as they respond.
#
# MAINTAINER PROCEDURE — post your question FIRST, then apply the label.
# `actions/stale` refuses to close an item if any human comment exists after the
# `labeled` event, so labeling and *then* asking means the item never closes.
# A third party commenting after the label has the same effect. This fails
# silently: the scheduled run logs "not old enough to close yet" and stays
# green, so there is no signal distinguishing "nothing due" from "never closes".
#
# The 10-day close window is measured from the item's `updated_at`, not from
# when the label was applied, so any activity by anyone postpones closure while
# the label persists.
#
# Because `remove-stale-when-updated: false` stops the stale action from
# clearing the label on activity, the trusted follow-up workflow is the *only*
# path that clears it. This workflow records every way an author can
# respond: conversation comments (`issue_comment`, which covers issues and PR
# conversations), review-thread replies (`pull_request_review_comment`),
# submitted reviews (`pull_request_review`), and pushing commits
# (`pull_request_target` / `synchronize`). Missing any of these would auto-close
# a PR with "we have not received a response" *after* the author responded.
#
# The follow-up workflow runs under `workflow_run` in the base-branch context,
# which grants a write token for fork PRs. It validates the response against the
# GitHub API before mutating a label; neither workflow checks out or executes PR
# code.

name: Needs Response

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [synchronize]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Key the concurrency group by issue/PR number for author-activity events so an
# author's reply is never discarded behind an unrelated comment or the
# scheduled stale scan; scheduled/dispatch runs share one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  # Fork-origin comment and review events receive a read-only token, so they
  # cannot remove a label directly. Store only the immutable response ID for
  # the trusted `workflow_run` consumer; it re-fetches and verifies everything.
  record-author-response:
    if: >-
      github.repository == 'langchain-ai/deepagents' &&
      contains(
        fromJSON('["issue_comment", "pull_request_review", "pull_request_review_comment"]'),
        github.event_name
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Record response identifier
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const response = {
              eventName: context.eventName,
              responseId:
                context.payload.comment?.id ?? context.payload.review?.id,
              pullNumber: context.payload.pull_request?.number,
            };

            if (!response.responseId) {
              core.setFailed(`No response ID found for ${context.eventName}`);
              return;
            }

            const fs = require('fs');
            fs.writeFileSync(
              `${process.env.RUNNER_TEMP}/author-response.json`,
              JSON.stringify(response),
            );

      - name: Upload response identifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: author-response
          path: ${{ runner.temp }}/author-response.json
          if-no-files-found: error
          retention-days: 1

  # `pull_request_target` has a write token even for fork PRs, so a push can
  # clear the label directly. Unlike comment and review events, it is already a
  # trusted-context event; it still excludes bot-authored PRs.
  remove-label-on-push:
    if: >-
      github.repository == 'langchain-ai/deepagents' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.pull_request.labels.*.name, 'needs-response') &&
      github.event.pull_request.user.type != 'Bot' &&
      github.actor == github.event.pull_request.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Remove needs-response label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.pull_request.number;

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issueNumber,
                name: 'needs-response',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              console.log(`needs-response was already absent from #${issueNumber}.`);
              return;
            }

            console.log(`Removed needs-response from #${issueNumber}.`);

  close-stale-issues:
    if: >-
      github.repository == 'langchain-ai/deepagents' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Close issues and PRs awaiting an author response
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Do not apply a stale label; only process issues and PRs that
          # maintainers explicitly marked as waiting on their original author.
          days-before-stale: -1
          stale-issue-label: needs-response
          stale-pr-label: needs-response
          # Let only the author-response jobs clear the label, so unrelated
          # activity does not reset an unanswered question.
          remove-stale-when-updated: false
          days-before-issue-close: 10
          days-before-pr-close: 10
          # Honor the repo-wide bypass label (see `close_old_prs.yml`) and skip
          # drafts, matching `close_old_prs.yml`. Both default to empty/false,
          # so without these a maintainer applying `do-not-close` would be
          # silently overruled.
          exempt-issue-labels: do-not-close
          exempt-pr-labels: do-not-close
          exempt-draft-pr: true
          # Default is 30, and exhausting the budget only logs a warning and
          # exits 0 — making a truncated sweep look identical to a clean one.
          # `getIssues` pages over every open issue and PR, spending operations
          # on `listEvents` + `listComments` per candidate.
          operations-per-run: 200
          close-issue-message: >
            This issue has been automatically closed because we have not
            received a response from the original author. Please
            comment with any additional information if you would like us to
            reopen it.
          close-pr-message: >
            This PR has been automatically closed because we have not
            received a response from the original author. Please
            comment with any additional information if you would like us to
            reopen it.
