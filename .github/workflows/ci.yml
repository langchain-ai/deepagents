# Main CI workflow for Deep Agents monorepo
#
# Runs on every pull request:
# - Linting for changed packages
# - Unit Tests for changed packages
#
# Only packages with changes are tested. SDK changes also trigger CLI and ACP tests.
# Pushes to main and workflow changes run full CI.

name: "🔧 CI"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  merge_group:

# Cancel redundant workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` lets the called `_test.yml` reusable workflow read live
# PR labels (re-runs replay the original event payload, so the API is the only
# fresh source). A called workflow's token can only narrow the caller's grants.
# The issues labels endpoint it uses accepts either `issues: read` or
# `pull-requests: read`, so no `issues` grant is needed here.
permissions:
  contents: read
  pull-requests: read

env:
  UV_NO_SYNC: "true"

jobs:
  # Detect which packages have changes
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      deepagents: ${{ steps.filter.outputs.deepagents }}
      code: ${{ steps.filter.outputs.code }}
      talon: ${{ steps.filter.outputs.talon }}
      # `talon-src` tracks only libs/talon/** so the `ci_success` waiver and
      # the advisory job can tell "PR touches talon sources" apart from
      # "talon CI runs" (the broad `talon` filter above also matches
      # libs/code and libs/deepagents because talon editable-installs them).
      talon-src: ${{ steps.filter.outputs.talon-src }}
      evals: ${{ steps.filter.outputs.evals }}
      acp: ${{ steps.filter.outputs.acp }}
      daytona: ${{ steps.filter.outputs.daytona }}
      modal: ${{ steps.filter.outputs.modal }}
      runloop: ${{ steps.filter.outputs.runloop }}
      vercel: ${{ steps.filter.outputs.vercel }}
      quickjs: ${{ steps.filter.outputs.quickjs }}
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "🔍 Check for changes"
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Each package filter includes workflow/action paths so that CI
          # infrastructure changes are validated against all packages.
          #
          # NOTE: Do NOT add negation patterns (e.g. '!libs/foo/**/*.md')
          # here. dorny/paths-filter evaluates patterns with OR logic, so a
          # negation like '!libs/deepagents/**/*.md' becomes "match anything
          # NOT in that glob" — causing unrelated files (e.g. .github/
          # templates) to match every filter and trigger full CI.
          # See: https://github.com/dorny/paths-filter/issues/97
          # Packages that editable-install the SDK (`deepagents = { path = ... }`)
          # must include 'libs/deepagents/**' so an SDK change runs their tests
          # too — otherwise a breaking SDK change merges green and only fails
          # on main, where every job runs unconditionally.
          filters: |
            deepagents:
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            code:
              - 'libs/code/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            talon:
              - 'libs/talon/**'
              - 'libs/deepagents/**'
              - 'libs/code/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            # The broad `talon` filter above decides whether talon CI RUNS;
            # this narrow one decides whether the PR TOUCHES talon sources.
            # `ci_success` and the talon-failure-advisory job key off this
            # output, so libs/code PRs (which match the broad filter via
            # 'libs/code/**') get the talon failure waiver.
            talon-src:
              - 'libs/talon/**'
            evals:
              - 'libs/evals/**'
              - 'libs/deepagents/**'
              # The evals test suite asserts on its own workflow files (e.g.
              # test_harbor_langsmith_integration.py reads harbor.yml and
              # _eval.yml), so editing any eval workflow must run the evals
              # tests that validate it — otherwise the change skips its guard.
              - '.github/workflows/evals.yml'
              - '.github/workflows/harbor.yml'
              - '.github/workflows/_harbor_run.yml'
              - '.github/workflows/unified_evals.yml'
              - '.github/workflows/clbench.yml'
              - '.github/workflows/evals_trials.yml'
              - '.github/workflows/_eval.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            acp:
              - 'libs/acp/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            daytona:
              - 'libs/partners/daytona/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            modal:
              - 'libs/partners/modal/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            runloop:
              - 'libs/partners/runloop/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            vercel:
              - 'libs/partners/vercel/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
            quickjs:
              - 'libs/partners/quickjs/**'
              - 'libs/deepagents/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_lint.yml'
              - '.github/workflows/_test.yml'
              - '.github/actions/**'
  # Run linting on changed packages
  lint-deepagents:
    name: "🧹 Lint deepagents"
    needs: changes
    if: needs.changes.outputs.deepagents == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/deepagents"
      python-version: "3.11"

  lint-code:
    name: "🧹 Lint code"
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/code"
      python-version: "3.12"

  lint-talon:
    name: "🧹 Lint talon"
    needs: changes
    if: needs.changes.outputs.talon == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/talon"
      python-version: "3.12"

  lint-evals:
    name: "🧹 Lint evals"
    needs: changes
    if: needs.changes.outputs.evals == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/evals"
      python-version: "3.13"

  lint-acp:
    name: "🧹 Lint acp"
    needs: changes
    if: needs.changes.outputs.acp == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/acp"
      python-version: "3.11"

  lint-daytona:
    name: "🧹 Lint daytona"
    needs: changes
    if: needs.changes.outputs.daytona == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/daytona"
      python-version: "3.11"

  lint-modal:
    name: "🧹 Lint modal"
    needs: changes
    if: needs.changes.outputs.modal == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/modal"
      python-version: "3.11"

  lint-runloop:
    name: "🧹 Lint runloop"
    needs: changes
    if: needs.changes.outputs.runloop == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/runloop"
      python-version: "3.11"

  lint-vercel:
    name: "🧹 Lint vercel"
    needs: changes
    if: needs.changes.outputs.vercel == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/vercel"
      python-version: "3.11"

  lint-quickjs:
    name: "🧹 Lint quickjs"
    needs: changes
    if: needs.changes.outputs.quickjs == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml
    with:
      working-directory: "libs/partners/quickjs"
      python-version: "3.11"

  # Run unit tests on changed packages
  test-deepagents:
    name: "🧪 Test deepagents"
    needs: changes
    if: needs.changes.outputs.deepagents == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/deepagents"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      extra-configurations: '[{"python-version": "3.13", "os": "windows-latest"}]'
      coverage-python-version: "3.12"

  test-code:
    name: "🧪 Test deepagents-code"
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/code"
      python-versions: '["3.12", "3.13", "3.14"]'
      coverage-python-version: "3.14"

  test-talon:
    name: "🧪 Test deepagents-talon"
    needs: changes
    if: needs.changes.outputs.talon == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/talon"
      python-versions: '["3.12", "3.13", "3.14"]'
      coverage-python-version: "3.12"

  test-evals:
    name: "🧪 Test evals"
    needs: changes
    if: needs.changes.outputs.evals == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/evals"
      python-versions: '["3.12", "3.13"]'
      coverage-python-version: "3.12"

  test-acp:
    name: "🧪 Test acp"
    needs: changes
    if: needs.changes.outputs.acp == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/acp"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.12"

  test-daytona:
    name: "🧪 Test daytona"
    needs: changes
    if: needs.changes.outputs.daytona == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/daytona"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.12"

  test-modal:
    name: "🧪 Test modal"
    needs: changes
    if: needs.changes.outputs.modal == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/modal"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.12"

  test-runloop:
    name: "🧪 Test runloop"
    needs: changes
    if: needs.changes.outputs.runloop == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/runloop"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.12"

  test-vercel:
    name: "🧪 Test vercel"
    needs: changes
    if: needs.changes.outputs.vercel == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/vercel"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.12"

  test-quickjs:
    name: "🧪 Test quickjs"
    needs: changes
    if: needs.changes.outputs.quickjs == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    with:
      working-directory: "libs/partners/quickjs"
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.11"

  # Catch SDK -> quickjs prompt-snapshot drift: when the deepagents SDK
  # changes but the quickjs partner is untouched, the full test-quickjs suite
  # does NOT run (it gates on the quickjs filter), so nothing would validate
  # quickjs's vendored system-prompt snapshots against the new SDK. This job
  # fills that gap by re-running just the prompt smoke tests against the
  # editable local SDK (resolved via [tool.uv.sources] in quickjs).
  #
  # Skipped when:
  #   - deepagents != 'true': the SDK is unchanged, so there is no new prompt
  #     wording for the snapshots to drift against.
  #   - quickjs == 'true': the full test-quickjs suite already runs these
  #     snapshots via `make test`, so this would be redundant.
  #   - push: test-quickjs runs on every push regardless of the filter, so
  #     the full suite covers the snapshots there too.
  test-quickjs-sdk-smoke:
    name: "🧪 Test quickjs SDK smoke"
    needs: changes
    if: >-
      github.event_name != 'push' &&
      needs.changes.outputs.deepagents == 'true' &&
      needs.changes.outputs.quickjs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Match the canonical test path (_test.yml) and the quickjs Makefile:
    # freeze against uv.lock so `uv sync` cannot rewrite the lockfile (which
    # would dirty the tree and trip the clean-working-directory check below).
    # The editable SDK path dep still reflects the checkout regardless.
    env:
      UV_FROZEN: "true"
    defaults:
      run:
        working-directory: "libs/partners/quickjs"
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🐍 Set up Python 3.11 + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          cache-suffix: test-quickjs-sdk-smoke
          working-directory: "libs/partners/quickjs"

      - name: "📦 Install Test Dependencies"
        shell: bash
        run: uv sync --group test

      # Fail loudly if the smoke test file is moved or renamed. Because any
      # change under libs/partners/quickjs/** flips the quickjs filter to
      # 'true' (skipping this job), such a rename lands on a PR that never
      # runs this job — so without this guard a stale path would silently
      # collect zero tests on some later SDK-only PR instead of failing here.
      - name: "🔍 Verify Smoke Test Path"
        shell: bash
        run: |
          set -eu
          test -f tests/unit_tests/smoke_tests/test_system_prompt.py || {
            echo "::error::quickjs smoke test file moved or renamed; update its path in ci.yml"
            exit 1
          }

      - name: "🧪 Run quickjs prompt smoke tests"
        shell: bash
        run: >-
          uv run --group test pytest
          --disable-socket
          --allow-unix-socket
          tests/unit_tests/smoke_tests/test_system_prompt.py

      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu
          STATUS="$(git status)"
          echo "$STATUS"
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  drbench-dataset:
    name: "🗂️ Build DRBench dataset"
    needs: changes
    if: needs.changes.outputs.evals == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # `datasets/drbench-evals` commits no task directories: all 100 are generated from
    # upstream's configs at the pinned commit. Since the generated tree is no longer in
    # the PR diff, this job is what proves generation still works and is reproducible.
    # `make dataset-check` builds the dataset twice and diffs -- catching a
    # nondeterministic generator, which would otherwise silently give this runner and a
    # developer's laptop different datasets and make their scores incomparable.
    env:
      UV_FROZEN: "true"
    defaults:
      run:
        working-directory: "libs/evals"
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🐍 Set up Python 3.12 + UV"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.12"
          cache-suffix: drbench-dataset
          working-directory: "libs/evals"

      - name: "📦 Install Dependencies"
        shell: bash
        run: uv sync

      - name: "🔁 Verify generation is deterministic"
        shell: bash
        run: make dataset-check

      - name: "🗂️ Build the dataset in place"
        shell: bash
        run: make dataset

      # The generated task directories are git-ignored, so building them must leave the
      # tree clean. A failure here means a generated path escaped .gitignore.
      - name: "🧹 Verify Clean Working Directory"
        shell: bash
        run: |
          set -eu
          STATUS="$(git status)"
          echo "$STATUS"
          echo "$STATUS" | grep 'nothing to commit, working tree clean'

  # Validates every helper script under .github/scripts/tests/. Job id/name
  # are kept for branch-protection compatibility; rename only with a coordinated PR.
  check-release-options:
    name: "Validate Release Options"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # test_release_notes.py shells out to `node --test`; pin Node so the
      # helper-script tests don't rely on whatever the runner image preinstalls.
      - name: "🟢 Setup Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: "📦 Install Dependencies"
        run: python -m pip install packaging pyyaml pytest
      - name: "🔍 Check workflow helper scripts"
        run: python -m pytest .github/scripts/tests -v

  # Advisory-only job: never fails the workflow and is deliberately NOT in
  # `ci_success.needs`, so its own result cannot gate anything. It runs on
  # PRs where the `talon-src` filter output is not 'true' — i.e. the PR does
  # not touch libs/talon, so the `ci_success` talon waiver may fire (see the
  # comment block there). It posts or updates a sticky PR comment recording
  # the waived failures; once the talon jobs pass again it deletes the
  # comment. Mirrors the sticky-comment pattern in
  # release_fanout_bypass_warn.yml.
  talon-failure-advisory:
    name: "⚠️ talon failure advisory"
    needs: [changes, lint-talon, test-talon]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.talon-src != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    # Serialize per-PR so rapid pushes cannot create duplicate stickies.
    concurrency:
      group: talon-ci-advisory-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: "Post, update, or delete the talon advisory comment"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.warning('No PR number in payload; skipping talon advisory comment.');
              return;
            }
            const STICKY_MARKER = '<!-- talon-ci-advisory -->';

            async function findStickyComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              return comments.find(c => c.body && c.body.startsWith(STICKY_MARKER));
            }

            const jobNames = ['lint-talon', 'test-talon'];
            const jobResults = {
              'lint-talon': '${{ needs.lint-talon.result }}',
              'test-talon': '${{ needs.test-talon.result }}',
            };
            const failed = jobNames.filter(j => jobResults[j] === 'failure');

            async function removeSticky() {
              try {
                const existing = await findStickyComment();
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner, repo, comment_id: existing.id,
                  });
                  console.log('talon jobs green (or not run) — deleted advisory comment');
                }
              } catch (e) {
                core.warning(`Could not clean up talon advisory comment for PR #${prNumber}: ${e.message}`);
              }
            }

            // Waiver condition no longer holds: talon passed or was skipped.
            if (failed.length === 0) {
              await removeSticky();
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              STICKY_MARKER,
              '⚠️ **talon CI failure(s) were waived for this PR.**',
              '',
              `Failed job(s): ${failed.map(j => `\`${j}\``).join(', ')} ([workflow run](${runUrl}))`,
              '',
              "**Why:** this PR doesn't touch `libs/talon`, so talon breakage does not block merge per repo policy. talon editable-installs `deepagents-code`, so its CI runs on every libs/code PR and can be broken by libs/code changes.",
              '',
              '**Required follow-up:** the breakage must be fixed in a separate `fix(talon): ...` PR — talon is red at HEAD until it lands. Please file or self-assign that fix, or confirm a maintainer is tracking it.',
            ].join('\n');

            try {
              const existing = await findStickyComment();
              if (existing) {
                if (existing.body !== body) {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: existing.id, body,
                  });
                  console.log('Updated talon advisory comment');
                } else {
                  console.log('talon advisory comment already up to date');
                }
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber, body,
                });
                console.log('Posted talon advisory comment');
              }
            } catch (commentErr) {
              core.warning(`Could not post talon advisory comment (fork PR token, rate limit, or transient API error): ${commentErr.message}`);
              await core.summary
                .addHeading('talon CI failure(s) waived; advisory comment could not be posted')
                .addRaw('Paste the following into the PR as a comment:')
                .addCodeBlock(body, 'markdown')
                .write();
            }

  project-readme-check:
    name: "Project README check"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: project-readme-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: "📋 Checkout trusted detector"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .readme-check-base
          sparse-checkout: |
            .github/scripts/checks/check_project_readmes.py
          persist-credentials: false

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: "Collect changed files"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            if (!pr || typeof pr.changed_files !== 'number') {
              core.setFailed('PR payload is missing a numeric changed_files total; failing closed.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (files.length !== pr.changed_files) {
              core.setFailed(`Changed-file list is incomplete (${files.length} of ${pr.changed_files}); failing closed.`);
              return;
            }
            const paths = new Set();
            for (const file of files) {
              paths.add(file.filename);
              if (file.previous_filename) paths.add(file.previous_filename);
            }
            fs.writeFileSync('changed_files.json', JSON.stringify([...paths]));

      - name: "Detect protected README edits"
        id: detect
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          detector=".readme-check-base/.github/scripts/checks/check_project_readmes.py"
          if [[ ! -f "$detector" ]]; then
            echo "::warning::Project README detector absent on base; gate is in its bootstrap window."
            result='{"pr_type":null,"readmes":[]}'
          else
            result=$(python "$detector" "$PR_TITLE" < changed_files.json)
          fi
          {
            echo "result<<__README_EOF__"
            echo "$result"
            echo "__README_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: "Comment and enforce acknowledgment"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.detect.outputs.result }}
        with:
          script: |
            const STICKY_MARKER = '<!-- project-readme-check -->';
            const ACKNOWLEDGMENT_LABEL = 'readme: acknowledged';
            const pr = context.payload.pull_request;
            let result;
            try {
              result = JSON.parse(process.env.RESULT || '');
            } catch (error) {
              core.setFailed(`README detector returned invalid JSON: ${error.message}`);
              return;
            }
            if (!result || !Array.isArray(result.readmes) || result.readmes.some(path => typeof path !== 'string')) {
              core.setFailed(`README detector returned an invalid result: ${JSON.stringify(result)}`);
              return;
            }

            const findSticky = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              return comments.find(comment => comment.body && comment.body.startsWith(STICKY_MARKER));
            };
            const upsertSticky = async body => {
              try {
                const existing = await findSticky();
                if (existing && existing.body !== body) {
                  await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                } else if (!existing) {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
                }
              } catch (error) {
                core.warning(`Could not post README gate comment: ${error.message}`);
                try {
                  await core.summary.addHeading('Project README check').addRaw(body).write();
                } catch (summaryError) {
                  core.warning(`Could not write README gate job summary: ${summaryError.message}`);
                }
              }
            };

            if (result.readmes.length === 0) {
              try {
                const existing = await findSticky();
                if (existing) await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              } catch (error) {
                core.warning(`Could not remove stale README gate comment: ${error.message}`);
              }
              return;
            }

            let labels;
            try {
              ({ data: labels } = await github.rest.issues.listLabelsOnIssue({
                ...context.repo,
                issue_number: pr.number,
              }));
            } catch (error) {
              core.setFailed(`Could not read live PR labels; failing closed: ${error.message}`);
              return;
            }
            const acknowledged = labels.some(label => label.name === ACKNOWLEDGMENT_LABEL);
            const pathList = result.readmes.map(path => `- \`${path}\``).join('\n');
            if (acknowledged) {
              await upsertSticky([
                STICKY_MARKER,
                `ℹ️ **Project README edits acknowledged** via the \`${ACKNOWLEDGMENT_LABEL}\` label.`,
                '',
                pathList,
                '',
                'Remove the label to re-enable the block.',
              ].join('\n'));
              return;
            }

            const body = [
              STICKY_MARKER,
              '⛔ **This PR edits a project README but is not a `docs` PR.**',
              '',
              pathList,
              '',
              `Change the PR title type to \`docs\` if the PR is documentation-only. Otherwise, apply the \`${ACKNOWLEDGMENT_LABEL}\` label to confirm these landing-page changes are intentional.`,
            ].join('\n');
            core.setFailed(`Project README edits require a docs PR or the '${ACKNOWLEDGMENT_LABEL}' label: ${result.readmes.join(', ')}`);
            await upsertSticky(body);

  # Final status check - ensures all jobs passed
  ci_success:
    name: "✅ CI Success"
    needs:
      - changes
      - lint-deepagents
      - lint-code
      - lint-talon
      - lint-evals
      - lint-acp
      - lint-daytona
      - lint-modal
      - lint-runloop
      - lint-vercel
      - lint-quickjs
      - test-deepagents
      - test-code
      - test-talon
      - test-evals
      - test-acp
      - test-daytona
      - test-modal
      - test-runloop
      - test-vercel
      - test-quickjs
      - test-quickjs-sdk-smoke
      - drbench-dataset
      - check-release-options
      - project-readme-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      # talon editable-installs deepagents-code (`libs/talon/pyproject.toml`,
      # [tool.uv.sources]), so the `talon` path filter above watches
      # libs/code/** and every libs/code PR runs lint-talon/test-talon. A
      # libs/code change can therefore break talon CI. The maintainers accept
      # merging such PRs with talon red at HEAD: the talon fix lands as its
      # own `fix(talon): ...` PR instead of forcing a combined PR (which would
      # also fan release-please out across both packages' changelogs). The
      # waiver keys off the narrow `talon-src` filter output (libs/talon/**
      # only), NOT the broad `talon` one that also matches libs/code and
      # libs/deepagents — keying off `talon` would make every libs/code PR
      # ineligible for its own waiver. On pull_request runs where the
      # `talon-src` filter output is not 'true', `failure` results from
      # lint-talon/test-talon are waived; `cancelled` results and every other
      # job still block, and push / merge_group runs stay fully strict so a
      # broken talon stays visible on main, where every job runs
      # unconditionally. The waiver logic lives in
      # .github/scripts/checks/ci_gate.py (unit-tested under
      # .github/scripts/tests/); talon CI still RUNS on these PRs — only its
      # blocking effect changes, and the talon-failure-advisory job posts a
      # sticky comment when the waiver fires.
      #
      # The gate script is executed from the PR's BASE ref, not the PR
      # checkout: on pull_request runs `actions/checkout` defaults to the
      # (untrusted) PR merge commit, so a PR that edited ci_gate.py could
      # make the required check pass regardless of real job results. Pinning
      # to `github.base_ref` keeps the decision logic maintainer-controlled.
      # `github.base_ref` is empty on push/merge_group, so `||` falls back to
      # the commit that triggered the run.
      - name: "📋 Checkout gate script from trusted base ref"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref || github.sha }}
          path: .ci-gate-base
          sparse-checkout: |
            .github/scripts/checks/ci_gate.py
          persist-credentials: false

      # Bootstrap window: ci_gate.py does not exist on main until this change
      # lands, so the base-ref checkout above is empty on the PR that
      # introduces it. Only for that window, check out the PR's own copy as a
      # fallback. Once the script is on the base branch, the base-ref copy is
      # always used and this second checkout never changes what runs.
      - name: "📋 Checkout PR gate script (bootstrap fallback)"
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-gate-pr
          sparse-checkout: |
            .github/scripts/checks/ci_gate.py
          persist-credentials: false

      - name: "🎉 All Checks Passed"
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Full needs context: the wildcard `toJSON(needs.*.result)` form
          # loses job names (it yields a bare array of result strings), so
          # the name -> result map is rebuilt from each entry below. Skipped
          # jobs are filtered out so the gate only judges jobs that ran.
          NEEDS: ${{ toJSON(needs) }}
          TALON_CHANGED: ${{ needs.changes.outputs.talon-src }}
        run: |
          set -euo pipefail
          # Get all job results (excluding 'changes' which always succeeds)
          results="$(printf '%s' "$NEEDS" | python3 -c '
          import json
          import sys

          needs = json.loads(sys.argv[1])
          results = {
              job: entry["result"]
              for job, entry in needs.items()
              if job != "changes" and entry["result"] != "skipped"
          }
          json.dump(results, sys.stdout)
          ' "$NEEDS")"
          echo "Job results: $results"

          gate_script=".ci-gate-base/.github/scripts/checks/ci_gate.py"
          if [ ! -f "$gate_script" ]; then
            # Bootstrap only: the script is not on the base branch yet.
            gate_script=".ci-gate-pr/.github/scripts/checks/ci_gate.py"
            echo "::warning::ci_gate.py not found on base ref; running the PR's copy (bootstrap window)."
          fi

          gate="$(python3 "$gate_script" \
            --event "$EVENT_NAME" \
            --talon "$TALON_CHANGED" \
            --results "$results")"
          echo "Gate decision: $gate"

          waived="$(printf '%s' "$gate" | python3 -c 'import json, sys; print("\n".join(json.loads(sys.argv[1])["waived"]))' "$gate")"
          if [ -n "$waived" ]; then
            while IFS= read -r job; do
              echo "::warning::⚠️ Waiving failing talon check: $job=failure (PR does not touch libs/talon; talon breakage is advisory here). Follow-up: fix talon in a separate fix(talon): ... PR."
            done <<< "$waived"
          fi

          failed="$(printf '%s' "$gate" | python3 -c 'import json, sys; print("\n".join(json.loads(sys.argv[1])["failed"]))' "$gate")"
          if [ -n "$failed" ]; then
            echo "Some jobs failed:"
            echo "$failed"
            exit 1
          fi

          # On main pushes, concurrency preemption routinely cancels
          # in-flight jobs when a newer commit arrives — the next run will
          # validate the latest state, so don't flag those as failures.
          # On PRs and merge_group runs, a cancellation is almost always a
          # human action or a real problem, so keep the gate strict.
          if [ "$EVENT_NAME" != "push" ]; then
            cancelled="$(printf '%s' "$gate" | python3 -c 'import json, sys; print("\n".join(json.loads(sys.argv[1])["cancelled"]))' "$gate")"
            if [ -n "$cancelled" ]; then
              echo "Some jobs were cancelled (not allowed on $EVENT_NAME runs):"
              echo "$cancelled"
              exit 1
            fi
          fi

          echo "All required checks passed (skipped jobs are OK)"
          exit 0
