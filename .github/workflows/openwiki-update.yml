name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: openwiki
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.4.2

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENWIKI_MODEL_ID: gpt-5.6-terra
          LANGSMITH_TRACING: "false"

      - name: Generate OpenWiki GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ORG_MEMBERSHIP_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_MEMBERSHIP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create OpenWiki update pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: openwiki/update
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find_update_pr() {
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" |
              jq -r --arg repository "$GITHUB_REPOSITORY" \
                '[.[] | select(.head.repo.full_name == $repository)][0].number // empty'
          }

          git restore -- .github/workflows/openwiki-update.yml

          # Stage only the paths OpenWiki is allowed to change.
          git add -- openwiki AGENTS.md

          if git diff --cached --quiet; then
            echo "No OpenWiki changes to commit."
            # The generated docs now match the base branch, so any open update
            # PR proposes obsolete content. Close it and delete its branch.
            pr_number="$(find_update_pr)"
            if [ -n "$pr_number" ]; then
              [[ "$pr_number" =~ ^[0-9]+$ ]]
              echo "Closing obsolete PR for $BRANCH."
              gh pr close "$pr_number" --delete-branch
            fi
            exit 0
          fi

          git commit -m "docs(repo): update OpenWiki"

          # Recreate the update branch from the new commit and publish it.
          git branch -f "$BRANCH"
          git push --force origin "$BRANCH"

          body=$'Automated OpenWiki documentation update.\n\nThis PR was generated by the scheduled OpenWiki workflow.'
          pr_number="$(find_update_pr)"

          # Open a PR only if one is not already open for this branch.
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "docs(repo): update OpenWiki" \
              --body "$body"
            pr_number="$(find_update_pr)"
          else
            echo "PR for $BRANCH already open; pushed updated commit."
          fi

          [[ "$pr_number" =~ ^[0-9]+$ ]]
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: ${{ steps.create-pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh pr merge --auto --squash "$PR_NUMBER"
