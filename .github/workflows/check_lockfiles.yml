# Check lockfile freshness and changed-file text hygiene
#
# Prevents PRs from being merged when lockfiles are out of sync with pyproject.toml

name: "🔒 Check Lockfiles"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-lockfiles:
    name: "Verify uv.lock files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "📋 Checkout Code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🐍 Set up Python and uv"
        uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.14"
          # `uv lock --check` never runs `uv sync`, so no cache dir exists,
          # and setup-uv's post-job save throws on a missing cache path,
          # failing the job. (`ignore-nothing-to-cache` would fix this too,
          # but `uv_setup` doesn't forward it.)
          enable-cache: "false"

      - name: "🔍 Check all lockfiles"
        run: python3 .github/scripts/checks/check_lockfiles_pre_commit.py

      - name: "📝 Run hygiene hooks on changed files"
        if: github.event_name != 'push'
        env:
          HYGIENE_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HYGIENE_TO: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PRE_COMMIT_COLOR: always
        run: |
          # The hook list lives in libs/Makefile so `make -C libs hygiene` runs
          # the same check locally.
          if ! make -C libs hygiene; then
            echo "::error::Changed files fail text hygiene hooks. Run \`make -C libs hygiene\` locally and commit the fixes."
            exit 1
          fi
