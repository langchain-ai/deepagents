[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-aerospike"
description = "Aerospike checkpoint store backend for deepagents agents"
license = { text = "MIT" }
readme = "README.md"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

version = "0.1.0"
requires-python = ">=3.11,<4.0"
keywords = ["deepagents", "langgraph", "checkpoint", "aerospike", "persistence"]

dependencies = [
    "deepagents>=0.7.0,<0.8.0",
    "langgraph>=1.2.12,<2.0.0",
    "langgraph-checkpoint-aerospike>=0.1.0",
    "aerospike-sdk>=0.9.0a5",
]

[tool.hatch.build.targets.wheel]
packages = ["deepagents_aerospike"]

[project.urls]
Homepage = "https://github.com/langchain-ai/deepagents/tree/main/libs/partners/aerospike"
Repository = "https://github.com/langchain-ai/deepagents"
Documentation = "https://github.com/langchain-ai/deepagents/tree/main/libs/partners/aerospike"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-socket",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-xdist",
    "pytest-cov",
    "ruff>=0.15.20,<0.16.0",
    "ty>=0.0.54,<1.0.0",
]

[tool.uv.sources]
deepagents = { path = "../../deepagents", editable = true }
langgraph-checkpoint-aerospike = { path = "../../../../langgraph-aerospike/packages/langgraph-checkpoint-aerospike", editable = true }
langgraph-store-aerospike = { path = "../../../../langgraph-aerospike/packages/langgraph-store-aerospike", editable = true }
aerospike-sdk = { path = "../../../../aerospike-client-python-sdk", editable = true }

[tool.ty.environment]
python-version = "3.11"
extra-paths = [
    "../../deepagents",
    "../../../../langgraph-aerospike/packages/langgraph-checkpoint-aerospike",
    "../../../../aerospike-client-python-sdk",
]

[tool.ruff]
line-length = 150

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed — too strict for generic wrappers
    "PLR0911",  # Too many return statements — branchy validation paths are intentionally flat
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests"]
markers = [
    "integration: mark test as requiring Aerospike server",
]
asyncio_mode = "auto"
filterwarnings = [
    # Unexpected warnings fail the run; see "Warnings are errors" in AGENTS.md.
    "error",
    # `langchain_core` imports `pydantic.v1` during collection on Python 3.14+.
    "ignore:Core Pydantic V1 functionality isn't compatible:UserWarning",
    # `google.genai.types` builds a union alias out of `typing._UnionGenericAlias`
    # at import time, which Python 3.14 deprecates. Nothing here can act on it --
    # it fires before any of our code runs and is fixed by upgrading the SDK.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google\\.genai\\.types",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "D",
    "ANN",
    "ARG",
    "FBT",
    "INP001",
    "SLF001",
    "PLC0415",
    "PLR2004",  # Magic values are idiomatic in test assertions.
    "TRY003",  # Test stubs/monkeypatches intentionally raise simple exceptions.
    "EM101",  # Test stubs use literal exception messages.
]
