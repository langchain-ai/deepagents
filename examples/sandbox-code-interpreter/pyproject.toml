[project]
name = "sandbox-code-interpreter"
version = "0.1.0"
description = "JS interpreter reading files from a remote LangSmith sandbox via programmatic tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents[quickjs]>=0.7.5",
    "langsmith[sandbox]>=0.10.9",
    "langchain-openai>=1.0.0",
]

[project.urls]
Repository = "https://github.com/langchain-ai/deepagents/tree/main/examples/sandbox-code-interpreter"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
