name: "🌐 Browser MDA eval (WebVoyager)"

# Drives a WebVoyager suite against an already-deployed Managed Deep Agent and
# records it as a LangSmith experiment. The agent and its browser run on
# LangSmith; this job only submits tasks, polls, grades, and posts feedback --
# so it is cheap to run here and does not need browser credentials.
#
# workflow_dispatch only works once this file is on the default branch. Until
# then, push to the `evals/browser-mda-run` branch to start a run with the
# defaults below.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON list of harnesses, e.g. ["repl","cli","mcp"]'
        type: string
        default: '["repl","cli","mcp"]'
      dataset:
        description: "LangSmith dataset name"
        type: string
        default: webvoyager-100
      repetitions:
        description: "Runs per task (3 gives a variance estimate)"
        type: string
        default: "1"
      concurrency:
        description: "Parallel tasks"
        type: string
        default: "6"
      limit:
        description: "Only the first N tasks (0 = all 30)"
        type: string
        default: "0"
  push:
    branches: [evals/browser-mda-run]

jobs:
  # Seeds the dataset into this key's workspace before any arm runs. Split from
  # `eval` rather than inlined so three matrix jobs cannot race to create the
  # same dataset.
  prep:
    runs-on: ubuntu-latest
    environment: oss
    outputs:
      # Passed to the arms so they read by id. Looking the dataset up by name
      # is not read-after-write consistent -- run 38152050542 created it at
      # 15:37:47 and all three arms died on "not found" at 15:38:04.
      dataset_id: ${{ steps.seed.outputs.dataset_id }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Ensure the dataset exists
        id: seed
        working-directory: browser-mda/benchmarks/webvoyager
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          DATASET: ${{ github.event.inputs.dataset || 'webvoyager-100' }}
        run: |
          set -euo pipefail
          uv run --with "langsmith>=0.14.7" python ensure_dataset.py \
            --dataset "$DATASET" --file webvoyager_100.jsonl

  eval:
    needs: prep
    # One job per harness, so a failure in one arm does not take the others
    # down with it and all three appear as separate rows in the run list.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.variants || '["repl","cli","mcp"]') }}
    name: "eval (${{ matrix.variant }})"
    runs-on: ubuntu-latest
    # Holds LANGSMITH_API_KEY; the workspace it belongs to must own the
    # dataset being run and have a TYPESAFE_API_KEY workspace secret, or the
    # gateway returns 424 when the Jev judge is called.
    environment: oss
    # 100 tasks x 1 rep at concurrency 6, with per-task timeouts of 900s.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run the suite
        working-directory: browser-mda/benchmarks/webvoyager
        env:
          # Both the deployment and the Jev judge authenticate with the
          # LangSmith key; the judge reaches Jev through the LangSmith gateway.
          # Two keys, two jobs. LANGSMITH_API_KEY must belong to the
          # workspace that owns the deployments, or every run dies on
          # `PermissionDeniedError: Invalid tenant ID`; ANTHROPIC_API_KEY is
          # the gateway service key the Jev judge authenticates with.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Inputs are null on a push event, so each one carries a default.
          # Kept out of the run script itself so they are never interpolated
          # into a shell command.
          VARIANT: ${{ matrix.variant }}
          DATASET: ${{ github.event.inputs.dataset || 'webvoyager-100' }}
          DATASET_ID: ${{ needs.prep.outputs.dataset_id }}
          REPETITIONS: ${{ github.event.inputs.repetitions || '1' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '6' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -euo pipefail
          LIMIT_ARG=()
          if [ "$LIMIT" != "0" ]; then
            LIMIT_ARG=(--limit "$LIMIT")
          fi
          uv run --with "langsmith>=0.14.7" --with langgraph-sdk --with httpx \
            python -u experiment_native.py \
              --variant "$VARIANT" \
              --dataset "$DATASET" \
              --repetitions "$REPETITIONS" \
              --concurrency "$CONCURRENCY" \
              "${LIMIT_ARG[@]}" \
            | tee eval.log

      - name: Summarise
        if: always()
        working-directory: browser-mda/benchmarks/webvoyager
        env:
          VARIANT: ${{ github.event.inputs.variant || 'repl' }}
        run: |
          {
            echo "## $VARIANT — WebVoyager"
            echo
            grep -E "^experiment project" eval.log || true
            echo
            echo '| outcome | n |'
            echo '| --- | --- |'
            grep -oE "^\[[A-Z]+ *\]" eval.log | sort | uniq -c \
              | awk '{gsub(/[\[\]]/,"",$2); print "| " $2 " | " $1 " |"}'
            echo
            grep -E "^SUCCESS|^feedback posted" eval.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: eval-${{ github.event.inputs.variant || 'repl' }}-log
          path: browser-mda/benchmarks/webvoyager/eval.log
