name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: openwiki
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.4.2

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENWIKI_MODEL_ID: gpt-5.6-terra
          LANGSMITH_TRACING: "false"

      - name: Generate OpenWiki GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPENWIKI_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENWIKI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create OpenWiki update pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: openwiki/update
          BASE: main
        run: |
          set -euo pipefail

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find_update_pr() {
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" |
              jq -r --arg repository "$GITHUB_REPOSITORY" \
                '[.[] | select(.head.repo.full_name == $repository)][0].number // empty'
          }

          git restore -- .github/workflows/openwiki-update.yml

          # Stage only the paths OpenWiki is allowed to change.
          git add -- openwiki AGENTS.md

          if git diff --cached --quiet; then
            echo "No OpenWiki changes to commit."
            # The generated docs now match the base branch, so any open update
            # PR proposes obsolete content. Close it and delete its branch.
            pr_number="$(find_update_pr)"
            if [ -n "$pr_number" ]; then
              [[ "$pr_number" =~ ^[0-9]+$ ]]
              echo "Closing obsolete PR for $BRANCH."
              gh pr close "$pr_number" --delete-branch
            fi
            exit 0
          fi

          git commit -m "docs(repo): update OpenWiki"
          head_sha="$(git rev-parse HEAD)"

          # Recreate the update branch from the new commit and publish it.
          git branch -f "$BRANCH"
          git push --force origin "$BRANCH"

          body=$'Automated OpenWiki documentation update.\n\nThis PR was generated by the scheduled OpenWiki workflow.'
          pr_number="$(find_update_pr)"

          # Open a PR only if one is not already open for this branch.
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "docs(repo): update OpenWiki" \
              --body "$body"
            pr_number="$(find_update_pr)"
          else
            echo "PR for $BRANCH already open; pushed updated commit."
          fi

          [[ "$pr_number" =~ ^[0-9]+$ ]]
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Merge OpenWiki update pull request
        if: ${{ steps.create-pr.outputs.number != '' }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.number }}
          HEAD_SHA: ${{ steps.create-pr.outputs.head-sha }}
          EXPECTED_BASE: main
          EXPECTED_HEAD: ${{ github.repository_owner }}:openwiki/update
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_BASE" == "main" ]] || exit 1
          [[ "$EXPECTED_HEAD" == "${GITHUB_REPOSITORY_OWNER}:openwiki/update" ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

          for ((attempt = 1; attempt <= 60; attempt++)); do
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            [[ "$(jq -r '.base.ref' <<< "$pr")" == "$EXPECTED_BASE" ]] || exit 1
            [[ "$(jq -r '.head.label' <<< "$pr")" == "$EXPECTED_HEAD" ]] || exit 1
            [[ "$(jq -r '.head.repo.full_name' <<< "$pr")" == "$GITHUB_REPOSITORY" ]] || exit 1
            [[ "$(jq -r '.head.sha' <<< "$pr")" == "$HEAD_SHA" ]] || exit 1
            if ! jq -e '.state == "open" and .mergeable != false' <<< "$pr" > /dev/null; then
              echo "::error::OpenWiki PR is closed or has merge conflicts."
              exit 1
            fi

            if response="$(gh api --include --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f merge_method=squash -f sha="$HEAD_SHA")"; then
              response="${response//$'\r'/}"
              jq -e '.merged == true' <<< "${response#*$'\n\n'}" > /dev/null
              echo "Merged OpenWiki PR #${PR_NUMBER}."
              exit 0
            fi

            response="${response//$'\r'/}"
            status="${response%%$'\n'*}"
            printf '%s\n' "${response#*$'\n\n'}"
            [[ "$status" =~ ^HTTP/[^[:space:]]+[[:space:]]+405([[:space:]]|$) ]] || exit 1
            if ((attempt < 60)); then
              echo "Merge requirements not yet satisfied; retrying in 15 seconds (${attempt}/60)."
              sleep 15
            fi
          done

          echo "::error::OpenWiki PR still cannot be merged after 60 attempts."
          exit 1
